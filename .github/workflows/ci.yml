name: Windows, macOS, and Android CI

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install cmake \
            dylibbundler \
            freetype \
            jpeg-turbo \
            libogg \
            libopenmpt \
            libpng \
            libvorbis \
            mpg123 \
            ninja \
            sdl2

      - name: Configure, build, and test
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Bundle executable
        run: |
          mkdir -p dist
          cp -R build/pvz95-coop.app dist/
          executable="dist/pvz95-coop.app/Contents/MacOS/pvz95-coop"
          libs="dist/pvz95-coop.app/Contents/Frameworks"
          mkdir -p "$libs"
          strip -x "$executable"
          dylibbundler -of -b -x "$executable" -d "$libs" -p @executable_path/../Frameworks/

          # Homebrew SDL2 is sdl2-compat and links SDL3 using a Homebrew path.
          # Newer releases resolve it through @rpath; older ones link it directly.
          sdl2_library="$(find "$libs" -maxdepth 1 -name 'libSDL2*.dylib' -print -quit)"
          sdl3_dependency="$(otool -L "$sdl2_library" | awk '/libSDL3/ { print $1; exit }')"
          install -m 755 "$(brew --prefix sdl3)/lib/libSDL3.dylib" "$libs/libSDL3.dylib"
          if test -n "$sdl3_dependency"; then
            install_name_tool -change "$sdl3_dependency" @loader_path/libSDL3.dylib "$sdl2_library"
          fi
          install_name_tool -id @loader_path/libSDL3.dylib "$libs/libSDL3.dylib"

          # A release bundle must never depend on the CI runner's package-manager paths.
          for binary in "$executable" "$libs"/*.dylib; do
            if otool -L "$binary" | grep -E '^\s+(/opt/homebrew|/usr/local)/' || \
               otool -l "$binary" | grep -E '^\s+path (/opt/homebrew|/usr/local)/'; then
              echo "Unbundled dependency found in $binary" >&2
              exit 1
            fi
          done
          codesign --force --deep -s - dist/pvz95-coop.app

      - uses: actions/upload-artifact@v7
        with:
          name: pvz95-coop-macos-arm64
          path: dist/

  windows-x64:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Install Ninja
        run: choco install ninja -y

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        shell: pwsh
        run: |
          cmake -G Ninja -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCONSOLE=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: |
          cmake --build build

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/pvz95-coop.exe dist/
          Copy-Item build/report.exe dist/

      - uses: actions/upload-artifact@v7
        with:
          name: pvz95-coop-windows-x64
          path: dist/

  android-arm64:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_API: "24"
      SDL2_VERSION: "2.32.10"
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - uses: android-actions/setup-android@v4

      - name: Select Android NDK
        run: |
          if test -n "$ANDROID_NDK_LATEST_HOME" && test -d "$ANDROID_NDK_LATEST_HOME"; then
            ndk_dir="$ANDROID_NDK_LATEST_HOME"
          else
            ndk_dir="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          test -n "$ndk_dir" && test -d "$ndk_dir"
          echo "ANDROID_NDK=$ndk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"

      - name: Download SDL2 source
        run: |
          curl -fL --retry 3 \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz" \
            -o sdl2.tar.gz
          tar xf sdl2.tar.gz
          mv "SDL2-${SDL2_VERSION}" sdl2-src

      - uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-android-arm64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Build shared SDL2
        run: |
          cmake -B build-sdl2 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-$ANDROID_API \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl2-android" \
            -DCMAKE_BUILD_TYPE=Release \
            sdl2-src
          cmake --build build-sdl2 -j"$(nproc)"
          cmake --install build-sdl2

      - name: Build native game library
        run: |
          build_dir=build-android-arm64-v8a
          cmake -B "$build_dir" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_CMAKE_SYSTEM_VERSION=$ANDROID_API \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-$ANDROID_API \
            -DSDL2_DIR="$GITHUB_WORKSPACE/sdl2-android/lib/cmake/SDL2" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build_dir" -j"$(nproc)"

          jni_dir=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$jni_dir"
          cp -L "$build_dir/libmain.so" "$jni_dir/"
          cp -L "$GITHUB_WORKSPACE/sdl2-android/lib/libSDL2.so" "$jni_dir/"
          find "$build_dir/vcpkg_installed/arm64-android/lib" -maxdepth 1 -name '*.so' \
            -exec cp -L {} "$jni_dir/" \; 2>/dev/null || true
          strip_tool="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for library in "$jni_dir"/*.so; do
            "$strip_tool" --strip-unneeded "$library"
          done
          ls -lh "$jni_dir"

      - name: Configure release signing
        env:
          PVZP_KEYSTORE_BASE64: ${{ secrets.PVZP_KEYSTORE_BASE64 }}
          PVZP_KEYSTORE_PASSWORD: ${{ secrets.PVZP_KEYSTORE_PASSWORD }}
          PVZP_KEY_ALIAS: ${{ secrets.PVZP_KEY_ALIAS }}
          PVZP_KEY_PASSWORD: ${{ secrets.PVZP_KEY_PASSWORD }}
        run: |
          if test -n "$PVZP_KEYSTORE_BASE64" && test -n "$PVZP_KEYSTORE_PASSWORD" && \
             test -n "$PVZP_KEY_ALIAS" && test -n "$PVZP_KEY_PASSWORD"; then
            echo "$PVZP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pvz95-coop-release.keystore"
            echo "PVZP_KEYSTORE_FILE=$RUNNER_TEMP/pvz95-coop-release.keystore" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Build APK
        env:
          PVZP_KEYSTORE_PASSWORD: ${{ secrets.PVZP_KEYSTORE_PASSWORD }}
          PVZP_KEY_ALIAS: ${{ secrets.PVZP_KEY_ALIAS }}
          PVZP_KEY_PASSWORD: ${{ secrets.PVZP_KEY_PASSWORD }}
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper
          ./gradlew assembleRelease -PusePrebuiltLibs=true --no-daemon

      - name: Verify and package APK
        run: |
          apk="$(find android -name '*.apk' -path '*/release/*' -print -quit)"
          test -n "$apk"
          build_tools="$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)")"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/(libmain|libSDL2)\.so'
          mkdir -p dist
          cp "$apk" dist/pvz95-coop-android-arm64-v8a.apk

      - uses: actions/upload-artifact@v7
        with:
          name: pvz95-coop-android-arm64-v8a
          path: dist/
