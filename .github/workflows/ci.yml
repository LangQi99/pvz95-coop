name: Windows and macOS CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install cmake \
            dylibbundler \
            freetype \
            jpeg-turbo \
            libogg \
            libopenmpt \
            libpng \
            libvorbis \
            mpg123 \
            ninja \
            sdl2

      - name: Configure, build, and test
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Bundle executable
        run: |
          mkdir -p dist
          cp -R build/pvz95-coop.app dist/
          executable="dist/pvz95-coop.app/Contents/MacOS/pvz95-coop"
          libs="dist/pvz95-coop.app/Contents/Frameworks"
          mkdir -p "$libs"
          strip -x "$executable"
          dylibbundler -of -b -x "$executable" -d "$libs" -p @executable_path/../Frameworks/

          # Homebrew SDL2 is sdl2-compat and links SDL3 using a Homebrew path.
          # Copy SDL3 into the bundle and rewrite both the dependency and dylib ID.
          sdl2_library="$(find "$libs" -maxdepth 1 -name 'libSDL2*.dylib' -print -quit)"
          sdl3_dependency="$(otool -L "$sdl2_library" | awk '/libSDL3/ { print $1; exit }')"
          test -n "$sdl3_dependency"
          install -m 755 "$(brew --prefix sdl3)/lib/libSDL3.dylib" "$libs/libSDL3.dylib"
          install_name_tool -change "$sdl3_dependency" @loader_path/libSDL3.dylib "$sdl2_library"
          install_name_tool -id @loader_path/libSDL3.dylib "$libs/libSDL3.dylib"

          # A release bundle must never depend on the CI runner's package-manager paths.
          for binary in "$executable" "$libs"/*.dylib; do
            if otool -L "$binary" | grep -E '^\s+(/opt/homebrew|/usr/local)/'; then
              echo "Unbundled dependency found in $binary" >&2
              exit 1
            fi
          done
          codesign --force --deep -s - dist/pvz95-coop.app

      - uses: actions/upload-artifact@v7
        with:
          name: pvz95-coop-macos-arm64
          path: dist/

  windows-x64:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Install Ninja
        run: choco install ninja -y

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        shell: pwsh
        run: |
          cmake -G Ninja -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCONSOLE=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: |
          cmake --build build

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/pvz95-coop.exe dist/

      - uses: actions/upload-artifact@v7
        with:
          name: pvz95-coop-windows-x64
          path: dist/
